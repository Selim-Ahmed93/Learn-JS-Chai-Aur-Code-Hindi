<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship | Dom Learning</title>
</head>
<body style = "background-color: #212121; color:white">
    <div style="text-align:center"class="parent">
        <div class="day">Sunday</div>
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">wednesday</div>
        <div class="day">thursday</div>
    </div>

    <div style="text-align: center; margin-top:20px;">
        <button id="button">Click</button>
    </div>
</body>
<script>
    const parent = document.querySelector('.parent');

    // console.log(parent.lastElementChild)

    const dayOne = document.querySelector('.day')
    //   console.log(dayOne)
     console.log(dayOne.parentElement)
     console.log(dayOne.nextElementSibling);
     console.log("NodeList:",parent.childNodes);


        //   for (let i = 0; i < parent.children.length; i++) {
        //     console.log(parent.children[i].innerHTML);
            
        //   }
    const parents = Array.from(parent.children);
    const Color = ['green','yellow','red','purple','white']
          parents.forEach(function (list,index){
            list.style.color = Color[index]
            
          });
          
     console.log("node list:",parent.childNodes)
          
          const Button = document.getElementById('button');
            Button.addEventListener('click', function(e){
                //   console.log('Hello Javascript')
                parent.children[0].innerHTML = 'Saturday'
                parent.children[0].style.fontSize = '50px';
                parent.children[0].style.color = 'red';
            })
</script>
</html>
